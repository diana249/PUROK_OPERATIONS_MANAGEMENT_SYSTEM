<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purok System Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #08263d;
            --muted: #3d6272;
            --panel: #d7dfd9;
            --line: #b6cabd;
            --brand: #0a7886;
            --brand-dark: #06616d;
            --shadow: 0 12px 30px rgba(16, 52, 62, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 8%, rgba(10, 120, 134, 0.18), transparent 35%),
                radial-gradient(circle at 80% 0%, rgba(194, 217, 201, 0.55), transparent 36%),
                linear-gradient(145deg, #c6dcc8 0%, #bbd1bd 100%);
        }

        .auth-card {
            width: min(500px, 94vw);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 26px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2rem;
            line-height: 1.05;
        }

        .subtitle {
            margin: 8px 0 16px;
            color: var(--muted);
        }

        .alerts {
            display: none;
        }

        .alert {
            border-radius: 10px;
            padding: 9px 11px;
            font-weight: 600;
            border: 1px solid #c6dce9;
            color: #1c4f6f;
            background: #deedf8;
        }

        .toast-stack {
            position: fixed;
            top: 16px;
            right: 16px;
            width: min(420px, calc(100vw - 32px));
            z-index: 2000;
            display: grid;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            border-radius: 12px;
            border: 1px solid #c7d9e6;
            background: #edf6fb;
            color: #173f57;
            box-shadow: 0 10px 30px rgba(15, 57, 79, 0.18);
            padding: 11px 13px;
            font-weight: 700;
            line-height: 1.35;
            pointer-events: auto;
            animation: toast-in .22s ease;
        }

        .toast.error {
            border-color: #e9bdc6;
            background: #fbe8ec;
            color: #7f1f30;
        }

        .toast.success {
            border-color: #b9e1cd;
            background: #e3f6ed;
            color: #1b5e43;
        }

        .toast.warning {
            border-color: #f1d8a7;
            background: #fff2d8;
            color: #734b0a;
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        form p {
            margin: 0 0 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 11px 12px;
            font: inherit;
            background: #e2e9e4;
        }

        input:focus {
            outline: 2px solid #bee1e5;
            border-color: #7ec5cc;
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 11px 14px;
            font: inherit;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            cursor: pointer;
        }

        .links {
            margin-top: 12px;
            color: var(--muted);
            text-align: center;
        }

        .links a {
            color: var(--brand-dark);
            font-weight: 700;
            text-decoration: none;
        }

        ul.errorlist {
            margin: 0 0 8px;
            color: #a12438;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            body {
                display: block;
                padding: 10px;
            }
            .auth-card {
                width: 100%;
                border-radius: 14px;
                padding: 14px;
                margin: 8px 0 12px;
            }
            h1 {
                font-size: 1.2rem;
            }
            .subtitle {
                font-size: 0.93rem;
            }
            label {
                font-size: 0.95rem;
            }
            input {
                font-size: 16px;
                min-height: 42px;
            }
            .btn {
                min-height: 42px;
                font-size: 0.95rem;
            }
            .toast-stack {
                top: 10px;
                right: 10px;
                width: calc(100vw - 20px);
            }
        }
    </style>
</head>
<body>
    <div id="toast-stack" class="toast-stack"></div>
    <section class="auth-card">
        <div id="notify-source" style="display:none;">
            {% if messages %}
                {% for message in messages %}
                    <div data-notify data-level="{{ message.tags|default:'info' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% block notifications %}{% endblock %}
        </div>
        {% block content %}{% endblock %}
    </section>
    <script>
        (function () {
            function getCookie(name) {
                const cookies = document.cookie ? document.cookie.split(";") : [];
                for (let i = 0; i < cookies.length; i += 1) {
                    const cookie = cookies[i].trim();
                    if (cookie.startsWith(name + "=")) {
                        return decodeURIComponent(cookie.substring(name.length + 1));
                    }
                }
                return "";
            }

            // Keep CSRF token in forms synchronized with the latest cookie value.
            document.querySelectorAll("form[method='post'], form[method='POST']").forEach((form) => {
                form.addEventListener("submit", () => {
                    const latestCsrf = getCookie("csrftoken");
                    if (!latestCsrf) return;
                    form.querySelectorAll("input[name='csrfmiddlewaretoken']").forEach((tokenInput) => {
                        tokenInput.value = latestCsrf;
                    });
                });
            });

            const source = document.getElementById("notify-source");
            const stack = document.getElementById("toast-stack");
            if (!source || !stack) return;

            const items = source.querySelectorAll("[data-notify]");
            items.forEach((item, index) => {
                const text = (item.textContent || "").trim();
                if (!text) return;

                const level = (item.getAttribute("data-level") || "info").toLowerCase();
                const toast = document.createElement("div");
                toast.className = "toast " + level;
                toast.textContent = text;

                setTimeout(() => {
                    stack.appendChild(toast);
                }, index * 170);

                setTimeout(() => {
                    toast.style.opacity = "0";
                    toast.style.transform = "translateY(-6px)";
                    toast.style.transition = "all .22s ease";
                    setTimeout(() => toast.remove(), 230);
                }, 4200 + (index * 170));
            });
        })();
    </script>
</body>
</html>
